services:
  userbot:
    build: .
    container_name: gemini_userbot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1G
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-8112}:${WEB_PORT:-8112}"
    # Required for first interactive Telegram sign-in.
    stdin_open: true
    tty: true
