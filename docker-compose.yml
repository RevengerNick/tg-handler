services:
  userbot:
    build: .
    container_name: gemini_userbot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1G
    env_file:
      - .env
    environment:
      WEB_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${WEB_PORT:-8112}:${WEB_PORT:-8112}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WEB_PORT:-8112}/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # Required for first interactive Telegram sign-in.
    stdin_open: true
    tty: true
